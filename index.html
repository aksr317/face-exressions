<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags and other head content -->

    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <style>
        /* Add this style block to round the corners of the video feed */
        .rounded-video {
            border-radius: 50%; /* Make it round */
            overflow: hidden;
            position: relative;
            border: 10px solid transparent; /* Set a transparent border */
            animation: animateBorder 3s ease-in-out infinite; /* Apply the border animation */
        }

        /* Add gradient background to the body */
        body {
            background: #111111; /* Updated background color */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        /* Change background color of h3 to #99C3FF */
        h3 {
            background: linear-gradient(90deg, #99C3FF, #99FFCC); /* Updated gradient background */
            padding: 10px; /* Add padding for better visibility */
            display: inline-block;
            border-radius: 5px; /* Add border radius for rounded corners */
        }

        .parallax-content {
            /* Add any parallax content styles as needed */
        }

        /* Add animation for the gradient border */
        @keyframes animateBorder {
            0%, 100% {
                border-image: linear-gradient(90deg, #99C3FF, #99FFCC);
                border-image-slice: 1;
            }

            50% {
                border-image: linear-gradient(90deg, #99FFCC, #99C3FF);
                border-image-slice: 1;
            }
        }

        .rounded-video img {
            width: 100%;
            height: auto;
        }
    </style>

    <title>Real Time Emotion Detection</title>
</head>
<body>
    <div class="parallax-content baner-content" id="home">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 offset-lg-2">
                    <!-- Apply the h3 style for background color change -->
                    <h3 class="mt-5"><font color="white" style="font-family:verdana;"> Real Time Emotion Detection</font></h3>

                    <!-- Apply the card class to create a card-style container -->
                    <div class="card rounded-video">
                        <img class="card-img-top" src="{{ url_for('video_feed') }}" alt="Video Feed">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
